equire separate legal and commercial approval.':''}</div></div><div class="toolbar"><div class="search">${icon('search',18)}<input id="catalog-search" placeholder="Search brands, SKU, product or supplier…" value="${attr(ui.query)}" autocomplete="off" aria-label="Search products"></div><select class="selector" id="catalog-category">${['All products',...CATEGORIES].map(c=>`<option ${c===ui.category?'selected':''}>${c}</option>`).join('')}</select><span style="font-size:11px;color:#7c9083"><span id="visibleCount">${buyerFilter().length}</span> listings</span></div><div class="buyer-layout"><div class="products-grid" id="buyerCatalog">${buyerCatalog()}</div><aside class="cart-card"><div class="cart-head"><h3>${icon('cart',17)} &nbsp; Purchase order cart</h3><p>${cartQty} cases selected · supplier-split at submission</p></div><div class="cart-content" id="buyerCart">${cartContent(active)}</div></aside></div>`}</main>`}
function cartContent(enabled){if(!ui.cart.length) return `<div class="empty" style="padding:24px 5px">${icon('cart',26)}<strong>Your cart is empty</strong><span>Add case quantities from the catalog.</span></div><div class="notice">${icon('info',14)}Case prices are illustrative.</div>`;const lines=ui.cart.map(c=>{const p=product(c.productId);if(!p)return '';return `<div class="cart-line"><div><strong>${esc(p.name)}</strong><small>${money(p.price)} / case · ${esc(supplier(p.supplierId)?.name)}</small><div class="cart-qty" style="margin-top:8px"><button class="qty-button" data-action="cart-minus" data-id="${p.id}" aria-label="Decrease quantity">−</button><strong>${c.quantity} cases</strong><button class="qty-button" data-action="cart-plus" data-id="${p.id}" aria-label="Increase quantity">+</button></div></div><strong>${money(p.price*c.quantity)}</strong></div>`}).join('');const sum=ui.cart.reduce((t,c)=>t+(product(c.productId)?.price||0)*c.quantity,0);return `${lines}<div class="cart-total"><span>Subtotal</span><strong>${money(sum)}</strong></div><div class="notice" style="margin-bottom:12px">${icon('info',15)}Taxes, logistics and payment handled offline in this demo.</div><button class="btn" data-action="submit-order" style="width:100%" ${enabled?'':'disabled'}>${icon('receipt',16)} Submit demo purchase order</button>${!enabled?'<div class="help" style="margin-top:8px">Ordering is available only in the Lebanon pilot.</div>':''}`}
function updateBuyerCatalog(){const n=document.querySelector('#buyerCatalog'),count=document.querySelector('#visibleCount');if(n)n.innerHTML=buyerCatalog();if(count)count.textContent=buyerFilter().length}
function supplierProducts(){const rows=data.products.filter(p=>p.supplierId===ui.supplierId);return `<div class="panel"><div class="panel-head"><div><h3>My product catalog</h3><p>Change prices, inventory and SKUs. Newly created listings require approval.</p></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn secondary sm" data-action="download-template">${icon('download',15)} CSV template</button><button class="btn secondary sm" data-action="import-csv">${icon('upload',15)} Import CSV</button><button class="btn sm" data-action="new-product">${icon('plus',15)} Add product</button><input type="file" id="csv-input" accept=".csv,text/csv" hidden></div></div><div class="table-wrap"><table>${tableHead(['Product / brand','SKU','Case pack','Price / case','Stock','Status','Actions'])}<tbody>${rows.map(p=>`<tr><td><strong>${esc(p.name)}</strong><small>${esc(p.brand)} · ${p.bottleMl} ml</small></td><td><span class="sku">${esc(p.sku)}</span></td><td>${p.caseSize} bottles</td><td><strong>${money(p.price)}</strong></td><td>${p.stock} cases</td><td>${pill(p.status)}</td><td><div class="table-actions"><button class="btn secondary tiny" data-action="edit-product" data-id="${p.id}">${icon('edit',12)} Edit</button></div></td></tr>`).join('')}</tbody></table>${!rows.length?empty('Your catalog is empty','Add products or import a CSV file to begin.'):''}</div></div><div class="notice">${icon('shield',16)}New listings and material price, SKU or territory changes are placed into the operator approval queue. Inventory-only changes remain immediately editable.</div>`}
function supplierOrders(){const rows=data.orders.flatMap(o=>o.suborders.filter(sub=>sub.supplierId===ui.supplierId).map(sub=>({parent:o,sub})));return `<div class="panel"><div class="panel-head"><div><h3>Incoming supplier purchase orders</h3><p>Only orders assigned to your supplier organization are shown.</p></div></div><div class="table-wrap"><table>${tableHead(['Supplier order','Buyer','Items','Value','Status','Next step'])}<tbody>${rows.map(({parent:o,sub})=>{const lines=o.lines.filter(l=>l.supplierId===ui.supplierId);return `<tr><td><strong>${esc(sub.id)}</strong><small>Parent ${esc(o.id)}</small></td><td>${esc(buyer(o.buyerId)?.name)}</td><td>${lines.map(l=>`${esc(product(l.productId)?.name)} ×${l.quantity}`).join('<br>')}</td><td><strong>${money(lines.reduce((s,l)=>s+l.quantity*l.unitPrice,0))}</strong></td><td>${pill(sub.status)}</td><td><div class="table-actions">${sub.status==='SUPPLIER_PENDING'?`<button class="btn sm" data-action="order-confirm" data-id="${sub.id}">Confirm</button><button class="btn secondary tiny" data-action="order-decline" data-id="${sub.id}">Decline</button>`:sub.status==='CONFIRMED'?`<button class="btn sm" data-action="order-ship" data-id="${sub.id}">Mark shipped</button>`:sub.status==='SHIPPED'?`<button class="btn secondary sm" data-action="order-deliver" data-id="${sub.id}">Mark delivered</button>`:'—'}</div></td></tr>`}).join('')}</tbody></table>${!rows.length?empty('No orders assigned','New buyer purchase orders will appear here.'):''}</div></div>`}
function renderSupplier(){const s=supplier(ui.supplierId);const rows=data.products.filter(p=>p.supplierId===s.id),orders=data.orders.flatMap(o=>o.suborders.filter(sub=>sub.supplierId===s.id));return `<main class="page-width"><div class="page-top"><div><div class="eyebrow">SUPPLIER EXPERIENCE · PRIVATE WORKSPACE</div><h1 class="page-title">Supplier product studio</h1><p class="page-sub">Your catalog, case prices, stock and incoming orders—under your control.</p></div><div class="page-actions"><select class="selector" id="supplier-select" aria-label="Select demo supplier">${data.suppliers.map(x=>`<option value="${x.id}" ${x.id===ui.supplierId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${pill(s.status)}</div></div><div class="workspace">${sideBar([{id:'products',icon:'box',label:'Products & SKUs'},{id:'orders',icon:'receipt',label:'Incoming orders'},{id:'company',icon:'shop',label:'Company profile'}],ui.supplierTab,'SUPPLIER TOOLS')}<section class="workspace-main"><div class="workspace-top"><div><div class="eyebrow">${esc(s.name)}</div><h2 class="workspace-title">${ui.supplierTab==='products'?'Product management':ui.supplierTab==='orders'?'Wholesale orders':'Company settings'}</h2><div class="workspace-desc">Each supplier has access only to its own products, prices and orders.</div></div><button class="btn secondary sm" data-action="nav" data-value="buyer">${icon('shop',15)} Preview buyer marketplace</button></div>${s.status!=='APPROVED'?`<div class="notice warning" style="margin-bottom:17px">${icon('alert',17)}Supplier approval is pending. Products can be prepared, but listings will not appear in the buyer marketplace until supplier and product approval.</div>`:''}<div class="stats-row">${stat('box',rows.length,'Total products')}${stat('shield',rows.filter(p=>p.status==='APPROVED').length,'Approved listings')}${stat('warehouse',rows.reduce((s,p)=>s+p.stock,0),'Cases in stock')}${stat('receipt',orders.length,'Supplier orders')}</div>${ui.supplierTab==='orders'?supplierOrders():ui.supplierTab==='company'?renderSupplierCompany(s):supplierProducts()}</section></div></main>`}
function renderSupplierCompany(s){return `<div class="panel"><div class="panel-head"><div><h3>Organization profile</h3><p>Review-only in this demonstration</p></div></div><div class="panel-inner">${[['Legal company name',s.name],['Primary region',s.region],['Account status',s.status],['Documents on record',s.documents],['Registered',s.since]].map(([a,b])=>`<div class="info-line"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`).join('')}</div></div><div class="notice">${icon('lock',16)}The production version will store uploaded compliance files privately and require independent verification before activation.</div>`}
function adminOverview(){const listings=data.products.filter(p=>p.status==='PENDING'),supplierPending=data.suppliers.filter(s=>s.status==='PENDING'),buyerPending=data.buyers.filter(b=>b.status==='PENDING');return `<div class="two-col"><div class="panel"><div class="panel-head"><div><h3>Approvals requiring attention</h3><p>Marketplace onboarding and product moderation</p></div><button class="btn secondary tiny" data-action="admin-tab" data-value="approvals">Review queue ${icon('arrow',14)}</button></div><div class="panel-inner">${[...supplierPending.map(x=>({name:x.name,label:'Supplier application',type:'supplier',id:x.id})),...buyerPending.map(x=>({name:x.name,label:'Buyer verification',type:'buyer',id:x.id})),...listings.map(x=>({name:x.name,label:'Product listing',type:'product',id:x.id}))].slice(0,5).map(x=>`<div class="activity"><div class="activity-circle">${icon(x.type==='product'?'box':'users',14)}</div><div style="flex:1"><strong>${esc(x.name)}</strong><small>${esc(x.label)}</small></div><button class="btn tiny" data-action="admin-approve" data-kind="${x.type}" data-id="${x.id}">Approve</button></div>`).join('')||empty('Queue is clear','All demo applications and listings are approved.')}</div></div><div class="panel"><div class="panel-head"><div><h3>Recent activity</h3><p>Operator and marketplace audit events</p></div></div><div class="panel-inner">${data.audit.slice(0,6).map(x=>`<div class="activity"><div class="activity-circle">${icon('clock',13)}</div><div><strong>${esc(x.title)}</strong><small>${esc(x.detail)} · ${esc(x.at)}</small></div></div>`).join('')}</div></div></div><div class="panel"><div class="panel-head"><div><h3>Marketplace orders</h3><p>Aggregate purchase orders spanning multiple sellers</p></div><button class="btn secondary tiny" data-action="admin-tab" data-value="orders">See all ${icon('arrow',14)}</button></div>${adminOrders(true)}</div>`}
function adminOrders(compact=false){return `<div class="table-wrap"><table>${tableHead(['Order','Buyer','Suppliers','Total','Status','Details'])}<tbody>${data.orders.slice().sort((a,b)=>b.id.localeCompare(a.id)).map(o=>`<tr><td><strong>${esc(o.id)}</strong><small>${esc(o.date)}</small></td><td>${esc(buyer(o.buyerId)?.name)}</td><td>${o.suborders.length}</td><td><strong>${money(orderTotal(o))}</strong></td><td>${pill(o.status)}</td><td><button class="btn secondary tiny" data-action="view-order" data-id="${o.id}">Inspect</button></td></tr>`).join('')}</tbody></table>${!data.orders.length?empty('No purchase orders','Buyer orders will appear after checkout.'):''}</div>`}
function adminApprovals(){return `<div class="panel"><div class="panel-head"><div><h3>Supplier approval queue</h3><p>Review legal entities before enabling supplier listings</p></div></div><div class="table-wrap"><table>${tableHead(['Supplier','Primary region','Status','Action'])}<tbody>${data.suppliers.map(s=>`<tr><td><strong>${esc(s.name)}</strong><small>${esc(s.documents)}</small></td><td>${esc(s.region)}</td><td>${pill(s.status)}</td><td>${s.status==='PENDING'?`<button class="btn sm" data-action="admin-approve" data-kind="supplier" data-id="${s.id}">Approve supplier</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="panel-head"><div><h3>Buyer verification queue</h3><p>Trade-buyer records are fictional placeholders in this demo</p></div></div><div class="table-wrap"><table>${tableHead(['Buyer organization','Market','Status','Action'])}<tbody>${data.buyers.map(b=>`<tr><td><strong>${esc(b.name)}</strong><small>License demo expiration: ${esc(b.licenseExpires)}</small></td><td>${esc(b.region)}</td><td>${pill(b.status)}</td><td>${b.status==='PENDING'?`<button class="btn sm" data-action="admin-approve" data-kind="buyer" data-id="${b.id}">Approve buyer</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="panel-head"><div><h3>Product listing queue</h3><p>Review new supplier listings and material changes</p></div></div><div class="table-wrap"><table>${tableHead(['Product','Supplier','Price','Markets','Status','Action'])}<tbody>${data.products.filter(p=>p.status==='PENDING').map(p=>`<tr><td><strong>${esc(p.name)}</strong><small>${esc(p.sku)}</small></td><td>${esc(supplier(p.supplierId)?.name)}</td><td>${money(p.price)}</td><td>${esc(p.markets.join(', '))}</td><td>${pill(p.status)}</td><td><button class="btn sm" data-action="admin-approve" data-kind="product" data-id="${p.id}">Approve listing</button></td></tr>`).join('')}</tbody></table>${!data.products.some(p=>p.status==='PENDING')?empty('No pending listings','All submitted products have been reviewed.'):''}</div></div>`}
function adminPolicies(){return `<div class="panel"><div class="panel-head"><div><h3>Market eligibility rules — demonstration</h3><p>Transactions remain disabled outside the configured pilot market</p></div></div><div class="table-wrap"><table>${tableHead(['Market','Demo ordering','Requirement','Status'])}<tbody><tr><td><strong>Lebanon</strong></td><td>Enabled for approved demo buyer</td><td>Trade buyer and supplier approvals</td><td><span class="pill green">DEMO PILOT</span></td></tr><tr><td><strong>United Arab Emirates</strong></td><td>Disabled</td><td>Territory-specific legal and commercial review</td><td><span class="pill amber">PREVIEW ONLY</span></td></tr><tr><td><strong>Bahrain</strong></td><td>Disabled</td><td>Territory-specific legal and commercial review</td><td><span class="pill amber">PREVIEW ONLY</span></td></tr></tbody></table></div></div><div class="notice warning">${icon('alert',17)}These settings demonstrate software access rules, not any actual legal authorization to trade alcohol. Real operations need jurisdiction-specific legal review, licenses, licensed counterparties and approved fulfillment.</div>`}
function renderAdmin(){const pending=data.suppliers.filter(x=>x.status==='PENDING').length+data.buyers.filter(x=>x.status==='PENDING').length+data.products.filter(x=>x.status==='PENDING').length;return `<main class="page-width"><div class="page-top"><div><div class="eyebrow">PLATFORM OPERATIONS · CENTRAL CONTROL</div><h1 class="page-title">Operator console</h1><p class="page-sub">Oversee supplier approvals, authorized buyer access, catalog moderation and order flows.</p></div><div class="page-actions"><span class="pill green">${icon('shield',14)} Controlled pilot</span><button class="btn secondary sm" data-action="reset">${icon('reset',14)} Reset data</button></div></div><div class="workspace">${sideBar([{id:'overview',icon:'grid',label:'Executive overview'},{id:'approvals',icon:'shield',label:'Approvals & compliance'},{id:'orders',icon:'receipt',label:'All purchase orders'},{id:'policies',icon:'globe',label:'Market policies'},{id:'activity',icon:'list',label:'Audit activity'}],ui.adminTab,'OPERATOR TOOLS')}<section class="workspace-main"><div class="workspace-top"><div><div class="eyebrow">MARKETPLACE CONTROL CENTER</div><h2 class="workspace-title">${({overview:'Marketplace overview',approvals:'Review & approvals',orders:'All marketplace orders',policies:'Territory controls',activity:'Audit event timeline'})[ui.adminTab]}</h2><div class="workspace-desc">Role-aware marketplace monitoring with synthetic business records.</div></div><button class="btn secondary sm" data-action="nav" data-value="supplier">${icon('warehouse',15)} Supplier experience</button></div><div class="stats-row">${stat('warehouse',data.suppliers.length,'Supplier organizations')}${stat('users',data.buyers.length,'Buyer organizations')}${stat('box',data.products.length,'Product listings')}${stat('clock',pending,'Items awaiting review')}</div>${ui.adminTab==='overview'?adminOverview():ui.adminTab==='approvals'?adminApprovals():ui.adminTab==='orders'?`<div class="panel"><div class="panel-head"><h3>All marketplace orders</h3></div>${adminOrders()}</div>`:ui.adminTab==='policies'?adminPolicies():`<div class="panel"><div class="panel-head"><h3>Activity history</h3></div><div class="panel-inner">${data.audit.map(x=>`<div class="activity"><div class="activity-circle">${icon('clock',14)}</div><div><strong>${esc(x.title)}</strong><small>${esc(x.detail)} · ${esc(x.at)}</small></div></div>`).join('')}</div></div>`}</section></div></main>`}
function productModal(){const existing=ui.modal?.id?product(ui.modal.id):null;if(existing&&existing.supplierId!==ui.supplierId)return '';const p=existing||{brand:'',name:'',sku:'',category:'Whiskey',bottleMl:750,caseSize:6,price:'',stock:0,markets:['Lebanon']};return `<form id="product-form"><div class="modal-head"><h3>${existing?'Edit product listing':'Add wholesale product'}</h3><button class="close" type="button" data-action="close-modal" aria-label="Close">${icon('close',17)}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label for="p-brand">Brand name *</label><input required maxlength="70" id="p-brand" name="brand" value="${attr(p.brand)}" placeholder="e.g. Highland Reserve"></div><div class="field"><label for="p-name">Product name *</label><input required maxlength="130" id="p-name" name="name" value="${attr(p.name)}" placeholder="Product description"></div><div class="field"><label for="p-sku">Supplier SKU *</label><input required maxlength="70" id="p-sku" name="sku" value="${attr(p.sku)}" placeholder="WHI-750-06"></div><div class="field"><label for="p-category">Category</label><select name="category" id="p-category">${CATEGORIES.map(x=>`<option ${p.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="p-size">Bottle size (ml) *</label><input type="number" required min="50" max="10000" id="p-size" name="bottleMl" value="${p.bottleMl}"></div><div class="field"><label for="p-case">Bottles per case *</label><input type="number" required min="1" max="100" id="p-case" name="caseSize" value="${p.caseSize}"></div><div class="field"><label for="p-price">Wholesale case price (USD) *</label><input type="number" required min="1" step=".01" max="1000000" id="p-price" name="price" value="${p.price}"></div><div class="field"><label for="p-stock">Stock available (cases) *</label><input type="number" required min="0" max="100000000" id="p-stock" name="stock" value="${p.stock}"></div><div class="field full"><label for="p-markets">Market availability (comma-separated)</label><input id="p-markets" name="markets" value="${attr(p.markets.join(', '))}" required><span class="help">Available: Lebanon, United Arab Emirates, Bahrain. Live demo ordering is restricted to eligible Lebanon accounts.</span></div></div><div class="modal-note">${icon('shield',14)} New listings and pricing/SKU/market changes require operator approval. Products are represented using generic bottle illustrations.</div></div><div class="modal-foot"><button type="button" class="btn secondary" data-action="close-modal">Cancel</button><button type="submit" class="btn">${icon('check',15)} ${existing?'Save changes':'Submit listing'}</button></div></form>`}
function orderModal(){const o=data.orders.find(x=>x.id===ui.modal?.id);if(!o)return '';return `<div class="modal-head"><h3>Purchase order ${esc(o.id)}</h3><button class="close" data-action="close-modal" aria-label="Close">${icon('close',17)}</button></div><div class="modal-body"><div class="notice">${icon('info',15)}This is a simulated order. No payment or external shipment is initiated.</div><div class="info-line"><span>Buyer</span><strong>${esc(buyer(o.buyerId)?.name)}</strong></div><div class="info-line"><span>Trade market</span><strong>${esc(o.market)}</strong></div><div class="info-line"><span>Order status</span>${pill(o.status)}</div><div class="info-line"><span>Created</span><strong>${esc(o.date)}</strong></div><h4 style="margin-top:24px">Supplier allocations</h4>${o.suborders.map(sub=>{const lines=o.lines.filter(l=>l.supplierId===sub.supplierId);return `<div style="padding:13px 0;border-bottom:1px solid #edf0ee"><div style="display:flex;justify-content:space-between"><strong>${esc(supplier(sub.supplierId)?.name)}</strong>${pill(sub.status)}</div><div class="sku">${esc(sub.id)}</div>${lines.map(l=>`<div class="info-line"><span>${esc(product(l.productId)?.name||'Product')} · ${l.quantity} cases</span><strong>${money(l.quantity*l.unitPrice)}</strong></div>`).join('')}</div>`}).join('')}<div class="info-line"><span>Aggregate order total</span><strong style="font-size:18px">${money(orderTotal(o))}</strong></div><div class="modal-note">Invoices, taxes, credit terms and transfers are intentionally outside this prototype.</div></div><div class="modal-foot"><button class="btn secondary" data-action="close-modal">Close</button></div>`}
function successModal(){const o=data.orders.find(x=>x.id===ui.modal?.id);return `<div class="modal-head"><h3>Purchase order created</h3><button class="close" data-action="close-modal">${icon('close',17)}</button></div><div class="modal-body" style="text-align:center"><div style="margin:auto auto 15px;width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:#e1f3e8;color:#176a50">${icon('check',30)}</div><h2 style="margin:0">${esc(o?.id)}</h2><p style="color:#73887b">Your simulated purchase order has been allocated across <strong>${o?.suborders.length||0} supplier(s)</strong>.</p><div class="notice">${icon('info',15)}In the Supplier Studio, switch suppliers and open Incoming orders to see the corresponding separate orders.</div></div><div class="modal-foot"><button class="btn secondary" data-action="close-modal">Close</button><button class="btn" data-action="go-orders">View my orders ${icon('arrow',14)}</button></div>`}
function renderModal(){if(!ui.modal)return '';let body=ui.modal.type==='product'?productModal():ui.modal.type==='order'?orderModal():ui.modal.type==='success'?successModal():`<div class="modal-head"><h3>Reset demonstration data?</h3><button class="close" data-action="close-modal">${icon('close',17)}</button></div><div class="modal-body"><p>This restores all sample suppliers, products, prices, approvals and purchase orders to their original values.</p><div class="notice warning">${icon('alert',16)}Any changes you made in this browser will be deleted.</div></div><div class="modal-foot"><button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn dark" data-action="confirm-reset">Reset demo data</button></div>`;return `<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${attr(ui.modal.type)}" data-modal-content="true">${body}</div></div>`}
function render(){document.getElementById('app').innerHTML=renderHeader()+(ui.view==='buyer'?renderBuyer():ui.view==='supplier'?renderSupplier():ui.view==='admin'?renderAdmin():renderHome())+renderFooter()+renderModal()}
function addCart(id){const p=product(id);if(!p||p.status!=='APPROVED'||supplier(p.supplierId)?.status!=='APPROVED'||!p.markets.includes(ui.buyerMarket)){toast('This listing is unavailable for the selected market.');return}const line=ui.cart.find(x=>x.productId===id);if((line?.quantity||0)>=p.stock){toast('Insufficient cases available.');return}if(line)line.quantity++;else ui.cart.push({productId:id,quantity:1});toast('Added a case to your purchase order.');if(ui.view!=='buyer'){ui.view='buyer';ui.buyerTab='catalog';scrollTo(0,0)}render()}
function calcOrderStatus(o){const statuses=o.suborders.map(x=>x.status);if(statuses.every(x=>x==='DELIVERED'))o.status='DELIVERED';else if(statuses.every(x=>x==='DECLINED'))o.status='REJECTED';else if(statuses.some(x=>['SHIPPED','DELIVERED'].includes(x)))o.status='PARTIALLY_FULFILLED';else if(statuses.some(x=>x==='CONFIRMED'))o.status='CONFIRMED';else o.status='SUBMITTED'}
function submitOrder(){const b=buyer(ui.buyerId);if(!ui.cart.length||ui.buyerMarket!=='Lebanon'||b.status!=='APPROVED'||b.region!==ui.buyerMarket){toast('This buyer cannot submit a purchase order in that territory.');return}for(const c of ui.cart){const p=product(c.productId);if(!p||p.stock<c.quantity||p.status!=='APPROVED'||supplier(p.supplierId)?.status!=='APPROVED'||!p.markets.includes(ui.buyerMarket)){toast('An item is no longer eligible or has insufficient stock.');return}}const id='ST-'+data.seq++;const lines=ui.cart.map(c=>{const p=product(c.productId);return {productId:p.id,quantity:c.quantity,unitPrice:p.price,supplierId:p.supplierId}});const supplierIds=[...new Set(lines.map(x=>x.supplierId))];const suborders=supplierIds.map((sid,i)=>({id:`${id}-${String.fromCharCode(65+i)}`,supplierId:sid,status:'SUPPLIER_PENDING'}));const o={id,buyerId:ui.buyerId,market:ui.buyerMarket,date:today(),status:'SUBMITTED',lines,suborders};lines.forEach(l=>{product(l.productId).stock-=l.quantity});data.orders.unshift(o);ui.cart=[];audit(`Purchase order ${id} submitted`,`${b.name} · ${suborders.length} supplier order(s)`);save();ui.modal={type:'success',id};render();toast('Multi-supplier order successfully generated.')}
function saveProduct(form){const raw=new FormData(form);const existing=ui.modal?.id?product(ui.modal.id):null;if(existing&&existing.supplierId!==ui.supplierId)return;const entry={brand:String(raw.get('brand')||'').trim(),name:String(raw.get('name')||'').trim(),sku:String(raw.get('sku')||'').trim().toUpperCase(),category:String(raw.get('category')||''),bottleMl:Number(raw.get('bottleMl')),caseSize:Number(raw.get('caseSize')),price:Number(raw.get('price')),stock:Number(raw.get('stock')),markets:String(raw.get('markets')||'').split(',').map(x=>x.trim()).filter(Boolean)};if(!entry.brand||!entry.name||!entry.sku||!(entry.bottleMl>0)||!(entry.caseSize>0)||!(entry.price>0)||!(entry.stock>=0)||!entry.markets.length||entry.markets.some(x=>!REGIONS.includes(x))){toast('Please complete all required product fields.');return}if(data.products.some(p=>p.supplierId===ui.supplierId&&p.sku===entry.sku&&p.id!==existing?.id)){toast('This SKU already exists for your supplier.');return}entry.tone={Vodka:'clear',Whiskey:'amber',Liqueur:'green',Gin:'clear',Wine:'amber'}[entry.category]||'green';if(existing){const changed=existing.brand!==entry.brand||existing.name!==entry.name||existing.sku!==entry.sku||existing.category!==entry.category||existing.bottleMl!==entry.bottleMl||existing.caseSize!==entry.caseSize||existing.price!==entry.price||existing.markets.join()!==entry.markets.join();Object.assign(existing,entry);if(changed)existing.status='PENDING';audit(`Supplier updated ${entry.sku}`,`${supplier(ui.supplierId).name} · ${changed?'Listing requires review':'Inventory updated'}`);toast(changed?'Product saved and sent for approval.':'Inventory updated successfully.')}else{const id='p'+Date.now();data.products.unshift({...entry,id,supplierId:ui.supplierId,status:'PENDING'});audit(`New product ${entry.sku} submitted`,`${supplier(ui.supplierId).name} · Pending operator review`);toast('New product submitted for approval.')}save();ui.modal=null;render()}
function approve(kind,id){let entry=kind==='product'?product(id):kind==='supplier'?supplier(id):kind==='buyer'?buyer(id):null;if(!entry||entry.status==='APPROVED')return;entry.status='APPROVED';audit(`${kind[0].toUpperCase()+kind.slice(1)} approved`,entry.name||entry.sku);save();render();toast('Approval saved. Catalog visibility updated.')}
function changeSupplierOrder(id,action){const parent=data.orders.find(o=>o.suborders.some(x=>x.id===id));if(!parent)return;const sub=parent.suborders.find(x=>x.id===id);if(sub.supplierId!==ui.supplierId)return;const changes={confirm:['SUPPLIER_PENDING','CONFIRMED'],decline:['SUPPLIER_PENDING','DECLINED'],ship:['CONFIRMED','SHIPPED'],deliver:['SHIPPED','DELIVERED']};const [prev,next]=changes[action]||[];if(sub.status!==prev)return;sub.status=next;if(next==='DECLINED'){parent.lines.filter(x=>x.supplierId===sub.supplierId).forEach(l=>{const p=product(l.productId);if(p)p.stock+=l.quantity})}calcOrderStatus(parent);audit(`Supplier order ${id} → ${next}`,supplier(ui.supplierId)?.name||'');save();render();toast(`Supplier order updated to ${next.replace('_',' ')}.`)}
function csvLine(line){const cells=[];let cell='',quoted=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){cells.push(cell.trim());cell=''}else cell+=ch}cells.push(cell.trim());return cells}
function downloadText(name,text){const blob=new Blob([text],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function handleCSV(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{const lines=String(reader.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2){toast('CSV file does not contain product rows.');return}const headers=csvLine(lines.shift()).map(x=>x.trim().toLowerCase());const mandatory=['name','brand','sku','category','bottle_ml','case_size','case_price','stock_cases','market'];if(mandatory.some(h=>!headers.includes(h))){toast('CSV columns do not match the template.');return}let imported=0,skipped=0;for(const line of lines){const cells=csvLine(line),r=Object.fromEntries(headers.map((h,i)=>[h,cells[i]]));const p={name:r.name,brand:r.brand,sku:(r.sku||'').toUpperCase(),category:r.category,bottleMl:Number(r.bottle_ml),caseSize:Number(r.case_size),price:Number(r.case_price),stock:Number(r.stock_cases),markets:[r.market],tone:{Vodka:'clear',Whiskey:'amber',Liqueur:'green',Gin:'clear',Wine:'amber'}[r.category]||'green'};if(!p.name||!p.brand||!p.sku||!CATEGORIES.includes(p.category)||!(p.bottleMl>0)||!(p.caseSize>0)||!(p.price>0)||!(p.stock>=0)||!REGIONS.includes(p.markets[0])||data.products.some(x=>x.supplierId===ui.supplierId&&x.sku===p.sku)){skipped++;continue}data.products.unshift({...p,id:'p'+Date.now()+'-'+imported,supplierId:ui.supplierId,status:'PENDING'});imported++}if(imported){audit(`${imported} products imported`,`${supplier(ui.supplierId).name} · Pending approval`);save()}render();toast(`Imported ${imported} listing(s); skipped ${skipped} invalid/duplicate row(s).`)};reader.readAsText(file)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id,value=el.dataset.value;if(a==='modal-backdrop'&&e.target!==el)return;if(a==='nav')nav(value);else if(a==='home-category'){ui.category=value;nav('buyer')}else if(a==='add-cart')addCart(id);else if(a==='cart-plus')addCart(id);else if(a==='cart-minus'){const line=ui.cart.find(x=>x.productId===id);if(line){line.quantity--;if(line.quantity<1)ui.cart=ui.cart.filter(x=>x.productId!==id)}render()}else if(a==='submit-order')submitOrder();else if(a==='buyer-tab'){ui.buyerTab=value;render()}else if(a==='tab'){ui.supplierTab=value;render()}else if(a==='admin-tab'){ui.adminTab=value;render()}else if(a==='new-product'){ui.modal={type:'product'};render()}else if(a==='edit-product'){ui.modal={type:'product',id};render()}else if(a==='close-modal'){ui.modal=null;render()}else if(a==='modal-backdrop'){ui.modal=null;render()}else if(a==='view-order'){ui.modal={type:'order',id};render()}else if(a==='admin-approve')approve(el.dataset.kind,id);else if(a==='order-confirm')changeSupplierOrder(id,'confirm');else if(a==='order-decline')changeSupplierOrder(id,'decline');else if(a==='order-ship')changeSupplierOrder(id,'ship');else if(a==='order-deliver')changeSupplierOrder(id,'deliver');else if(a==='go-orders'){ui.buyerTab='orders';nav('buyer')}else if(a==='reset'){ui.modal={type:'reset'};render()}else if(a==='confirm-reset'){data=seed();ui.cart=[];ui.modal=null;ui.category='All products';ui.query='';ui.buyerMarket='Lebanon';ui.supplierId='s1';ui.supplierTab='products';ui.adminTab='overview';ui.buyerTab='catalog';save();nav('home');toast('Demo data reset to original records.')}else if(a==='download-template')downloadText('spirits-trade-products-template.csv','name,brand,sku,category,bottle_ml,case_size,case_price,stock_cases,market\nExample Reserve,Example Brand,EXM-750-06,Whiskey,750,6,180,25,Lebanon\n');else if(a==='import-csv')document.getElementById('csv-input')?.click()});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){ui.query=e.target.value;updateBuyerCatalog()}});
document.addEventListener('change',e=>{if(e.target.id==='supplier-select'){ui.supplierId=e.target.value;render()}else if(e.target.id==='buyer-market'){ui.buyerMarket=e.target.value;ui.cart=[];render()}else if(e.target.id==='catalog-category'){ui.category=e.target.value;updateBuyerCatalog()}else if(e.target.id==='csv-input')handleCSV(e.target.files?.[0])});
document.addEventListener('submit',e=>{if(e.target.id==='product-form'){e.preventDefault();saveProduct(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}if(e.key==='Enter'&&e.target.classList.contains('brand'))nav('home')});
render();
})();

</script>
